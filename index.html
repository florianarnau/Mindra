<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mindra — L’atelier visuel du Machine Learning</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #faf9fb;
      color: #222;
      text-align: center;
      line-height: 1.6;
    }
    header {
      background: #561760;
      color: white;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.4em;
    }
    h2 {
      font-weight: 400;
      color: #ddd;
      margin-top: 0;
    }
    .content {
      max-width: 800px;
      margin: 50px auto;
      padding: 0 20px;
    }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      margin: 15px 10px;
      border-radius: 8px;
      background: #561760;
      color: white;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.3s;
    }
    .btn:hover {
      background: #702294;
    }
    img {
      max-width: 90%;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      margin-top: 30px;
    }
    footer {
      margin-top: 80px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo Mindra" width="120" />
    <h1>Mindra</h1>
    <h2>L’atelier visuel du Machine Learning</h2>
  </header>

  <section class="content">
    <p>
      Une application <b>Streamlit</b> interactive pour explorer, préparer, entraîner et évaluer vos modèles de Machine Learning en toute simplicité.
    </p>
    <a class="btn" href="https://florianarnau-mindra.streamlit.app/" target="_blank">🚀 Lancer l’application</a>
    <a class="btn" href="https://github.com/florianarnau/Mindra" target="_blank">📦 Voir le projet</a>

    <img src="assets/image1.png" alt="Aperçu de Mindra" />
  </section>

  <footer>
    © 2025 Mindra — Développé par Florian Arnau
  </footer>
</body>
</html>
